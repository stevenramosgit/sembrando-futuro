:root{--fondo:#FBFAF7;--pagina:#EEEBE3;--superficie:#FFFFFF;--superficie-2:#F4F2EC;--tinta:#191C17;--tinta-2:#4A5145;--tinta-3:#646B5F;--linea:#E6E2D8;--linea-fuerte:#CFC9BA;--verde:#2D6A27;--verde-hover:#24561F;--verde-tinta:#FFFFFF;--verde-suave:#EEF4E6;--verde-texto:#1F4D1B;--tierra:#8A5A2B;--tierra-suave:#F6EEE3;--rojo:#A8281D;--rojo-suave:#FCEFED;--ambar:#6B4A00;--ambar-suave:#FFF6E0;--gasto:#B8662F;--sombra:0 1px 2px rgba(25,28,23,.04),0 4px 16px rgba(25,28,23,.06);--marco:#191C17;--radio:12px;--radio-sm:8px;--ease:cubic-bezier(.23,1,.32,1);
  --bs-body-font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--bs-body-font-size:1.125rem;--bs-body-color:var(--tinta);--bs-body-bg:var(--fondo);--bs-border-color:var(--linea);--bs-link-color:var(--verde);--bs-link-hover-color:var(--verde-hover)}

html,body{height:100%}
body{margin:0;background:var(--pagina);color:var(--tinta);font-family:var(--bs-body-font-family);font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
h2,h3{font-weight:700;letter-spacing:-.015em;color:var(--tinta)}
h2{font-size:1.6rem;margin:0 0 6px;line-height:1.2;text-wrap:balance}
h3{font-size:1.2rem;margin:0 0 8px}
p{margin:0 0 12px;color:var(--tinta-2)}
a{color:var(--verde)}
:focus-visible{outline:3px solid #E3A008;outline-offset:2px;border-radius:6px}
.nw{white-space:nowrap}
.muted{color:var(--tinta-2);font-size:18px}
.ico{flex:0 0 auto}

/* ---------- marco de la aplicación: pantalla completa en el teléfono, columna centrada en el computador */
#screen{font-size:18px;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;position:relative;background:var(--fondo);padding-top:env(safe-area-inset-top,0px)}
@media (min-width:560px){#screen{box-shadow:0 0 0 1px var(--linea),0 24px 60px rgba(25,28,23,.14)}}

/* ---------- encabezado */
.appbar{display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:64px;background:var(--superficie);border-bottom:1px solid var(--linea)}
.appbar h1{font-size:1.25rem;margin:0;font-weight:700;letter-spacing:-.015em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tinta)}
.appbar .marca{width:36px;height:36px;border-radius:10px;flex:0 0 36px}
.back{background:transparent;border:0;color:var(--tinta);min-width:48px;min-height:48px;margin:-6px 0 -6px -10px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radio-sm);cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:16px;font-weight:600;border:0;border-radius:999px;padding:8px 14px;white-space:nowrap;background:var(--superficie-2);color:var(--tinta-2);cursor:pointer;min-height:48px;min-width:48px}
.pill .punto{width:9px;height:9px;border-radius:50%;background:var(--verde);flex:0 0 9px}
.pill.fuera{background:var(--ambar-suave);color:var(--ambar)}
.pill.fuera .punto{background:#D68A1C}
.pill.cuenta{background:transparent;border:1px solid var(--linea-fuerte);color:var(--tinta);padding:0;width:48px;justify-content:center}

/* ---------- contenido */
.content{flex:1;overflow-y:auto;padding:20px 16px 24px}

/* ---------- barra inferior con íconos */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--linea);background:var(--superficie);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{letter-spacing:-.035em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--tinta-2);font:inherit;font-size:16px;font-weight:500;padding:8px 0 6px;min-height:60px;cursor:pointer;position:relative}
.tabs button[aria-current="page"]{color:var(--verde-texto);font-weight:700}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--verde)}
.tabs button[aria-current="page"] .ico{color:var(--verde)}

/* ---------- botones (Bootstrap .btn con el tema del proyecto) */
.btn{--bs-btn-border-radius:var(--radio-sm);min-height:52px;font-size:18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform 160ms var(--ease),background-color 150ms ease,border-color 150ms ease,color 150ms ease}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled,.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-primario{background:var(--verde);color:var(--verde-tinta);border:1px solid var(--verde)}
.btn-primario:hover,.btn-primario:focus-visible,.btn-primario:active{background:var(--verde-hover);border-color:var(--verde-hover);color:var(--verde-tinta)}
.btn-contorno{background:var(--superficie);color:var(--tinta);border:1px solid var(--linea-fuerte)}
.btn-contorno:hover,.btn-contorno:focus-visible,.btn-contorno:active{background:var(--superficie-2);border-color:var(--tinta-3);color:var(--tinta)}
.btn-peligro{background:var(--superficie);color:var(--rojo);border:1px solid var(--rojo)}
.btn-peligro:hover,.btn-peligro:focus-visible,.btn-peligro:active{background:var(--rojo-suave);border-color:var(--rojo);color:var(--rojo)}
#screen a{display:inline-block;min-height:48px;padding:12px 4px;line-height:1.4}
.linkbtn{background:none;border:0;color:var(--verde);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;padding:12px 6px;min-height:48px;cursor:pointer;display:block;margin:0 auto}

/* ---------- formularios (Bootstrap .form-label, .form-control, .form-select, .form-check) */
label{display:block;font-weight:600;font-size:18px;margin:0 0 6px;color:var(--tinta)}
.field{margin-bottom:16px}
.form-label{display:block;font-weight:600;font-size:18px;margin:0 0 6px;color:var(--tinta)}
.form-control,.form-select{min-height:52px;font-size:18px;color:var(--tinta);background-color:var(--superficie);border:1px solid var(--linea-fuerte);border-radius:var(--radio-sm);padding:8px 14px}
.form-select{padding-right:2.4rem}
.form-control::placeholder{color:var(--tinta-3)}
.form-control:focus,.form-select:focus{background-color:var(--superficie);color:var(--tinta);border-color:var(--verde);box-shadow:0 0 0 4px color-mix(in srgb,var(--verde) 22%,transparent);outline:0}
.form-control.is-invalid,.form-select.is-invalid{border-color:var(--rojo);border-width:2px;background-image:none;padding-right:14px}
.form-control.is-invalid:focus,.form-select.is-invalid:focus{border-color:var(--rojo);box-shadow:0 0 0 4px color-mix(in srgb,var(--rojo) 22%,transparent)}
.err{color:var(--rojo);font-weight:600;font-size:18px;margin-top:6px;display:flex;gap:8px}
.err::before{content:"!";display:inline-flex;align-items:center;justify-content:center;flex:0 0 20px;height:20px;border-radius:50%;background:var(--rojo);color:var(--superficie);font-size:13px;margin-top:3px}
.hint{color:var(--tinta-2);font-size:18px;margin-top:4px}
.form-check{display:flex;gap:12px;align-items:flex-start;padding:0;margin:0 0 8px;min-height:48px}
.form-check .form-check-input{float:none;margin:2px 0 0;width:28px;height:28px;flex:0 0 28px;border:2px solid var(--linea-fuerte);background-color:var(--superficie);cursor:pointer}
.form-check .form-check-input:checked{background-color:var(--verde);border-color:var(--verde)}
.form-check .form-check-input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--verde) 22%,transparent)}
.form-check-label{font-size:18px;font-weight:400;color:var(--tinta)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:16px}
.seg button{min-height:48px;border-radius:var(--radio-sm);border:1px solid var(--linea-fuerte);background:var(--superficie);color:var(--tinta);font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--verde-tinta)}

/* ---------- tarjetas, avisos y filas (Bootstrap .card, .alert) */
.card{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--radio);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sombra);color:var(--tinta)}
.card.hl{background:var(--verde-suave);border-color:color-mix(in srgb,var(--verde) 35%,var(--linea))}
.card h3{margin:0 0 8px}
.alert{border-radius:var(--radio-sm);font-size:18px;padding:12px 14px;margin-bottom:14px;border:1px solid transparent;opacity:1;transform:none;transition:opacity 250ms var(--ease),transform 250ms var(--ease)}
@starting-style{.alert{opacity:0;transform:translateY(-6px)}}
.alert-success{background:var(--verde-suave);border-color:color-mix(in srgb,var(--verde) 40%,var(--linea));color:var(--verde-texto)}
.alert-warning{background:var(--ambar-suave);border-color:color-mix(in srgb,var(--ambar) 45%,var(--linea));color:var(--ambar)}
.alert-danger{background:var(--rojo-suave);border-color:color-mix(in srgb,var(--rojo) 45%,var(--linea));color:var(--rojo)}
.alert-secondary{background:var(--superficie-2);border-color:var(--linea);color:var(--tinta)}
.alert .muted{color:inherit;opacity:.85}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.kv.perdida span,.kv.perdida b{color:var(--rojo);font-weight:700}
.fila{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:0}
.fila .grow{flex:1;min-width:0}.fila b{font-variant-numeric:tabular-nums}
.fila button.tap{all:unset;display:flex;flex:1;align-items:center;gap:12px;cursor:pointer;min-height:48px;color:var(--tinta)}
.fila button.tap:focus-visible{outline:3px solid #E3A008;outline-offset:2px;border-radius:6px}
.fila .monto{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fila .monto.entra{color:var(--verde-texto)}
.fila .monto.sale{color:var(--tinta)}
.chip-ico{width:40px;height:40px;border-radius:10px;display:inline-grid;place-items:center;flex:0 0 40px}
.chip-gasto{background:var(--tierra-suave);color:var(--gasto)}
.chip-jornal{background:var(--superficie-2);color:var(--tinta-2)}
.chip-ingreso{background:var(--verde-suave);color:var(--verde)}
.chip-verde{background:var(--verde-suave);color:var(--verde)}

/* ---------- etiquetas (Bootstrap .badge) */
.badge{font-size:16px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--verde);color:var(--verde-texto);background:var(--verde-suave)}
.badge.sem-verde{border-color:var(--verde);color:var(--verde-texto);background:var(--verde-suave)}
.badge.sem-amarillo{border-color:var(--ambar);color:var(--ambar);background:var(--ambar-suave)}
.badge.sem-rojo{border-color:var(--rojo);color:var(--rojo);background:var(--rojo-suave)}
.badge.off{border-color:var(--linea-fuerte);color:var(--tinta-2);background:var(--superficie-2)}
button.badge{min-height:48px;min-width:48px;padding:6px 16px;cursor:pointer;font-family:inherit}

/* ---------- panel: indicadores y barras */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--superficie);border:1px solid var(--linea);border-radius:var(--radio);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{color:var(--tinta-2);font-size:18px;font-weight:500;display:flex;align-items:flex-start;gap:6px;line-height:1.3}
.kpi span .ico{margin-top:3px}
.kpi b{font-size:1.375rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi-grande{grid-column:1/-1;padding:18px 20px}
.kpi-grande b{font-size:2.125rem;line-height:1.1}
.kpi-grande small{font-size:18px;color:inherit;opacity:.9}
.kpi.ganancia{background:var(--verde-suave);border-color:color-mix(in srgb,var(--verde) 35%,var(--linea))}
.kpi.ganancia b,.kpi.ganancia span,.kpi.ganancia small{color:var(--verde-texto)}
.kpi.perdida{background:var(--rojo-suave);border-color:color-mix(in srgb,var(--rojo) 40%,var(--linea))}
.kpi.perdida b,.kpi.perdida span,.kpi.perdida small{color:var(--rojo)}
.barras{display:grid;gap:12px}
.barra-fila{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;font-size:18px}
.barra-fila span{color:var(--tinta-2)}
.barra-pista{height:14px;border-radius:999px;background:var(--superficie-2);overflow:hidden}
.barra{height:100%;border-radius:inherit;transform-origin:left;transform:scaleX(var(--v,0));animation:crecer 600ms var(--ease) both}
.barra-ingreso{background:var(--verde)}.barra-gasto{background:var(--gasto)}
@keyframes crecer{from{transform:scaleX(0)}}
.big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.legal{white-space:pre-line;font-size:18px}

/* ---------- bienvenida y acceso */
.portada{text-align:center;padding:12px 0 20px}
.portada img{width:84px;height:84px;margin-bottom:12px}
.portada h2{font-size:1.9rem}
.ventajas{list-style:none;margin:20px 0 8px;padding:0;display:grid;gap:12px}
.ventajas li{display:flex;gap:12px;align-items:center;color:var(--tinta-2);line-height:1.35}
.vacio-ico{width:64px;height:64px;border-radius:16px;display:inline-grid;place-items:center;background:var(--verde-suave);color:var(--verde);margin-bottom:12px}
.tarjeta-finca{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tarjeta-finca h3{margin:0}

/* ---------- aviso flotante (deshacer) */
.snack{position:absolute;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--tinta);color:var(--fondo);border-radius:var(--radio);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:18px;box-shadow:0 12px 32px rgba(25,28,23,.25)}
.snack button{background:none;border:2px solid currentColor;color:inherit;border-radius:var(--radio-sm);font:inherit;font-weight:700;padding:6px 12px;min-height:48px;min-width:48px;cursor:pointer}

.skip{position:absolute;left:-999px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---- marco del teléfono y panel de prueba (solo del prototipo) ---- */
html,body{height:auto}
body{padding:20px 16px}
.wrap{display:flex;gap:28px;justify-content:center;align-items:flex-start;flex-wrap:wrap;max-width:1100px;margin:0 auto}
.phone{position:sticky;top:16px;width:390px;max-width:100%;background:var(--marco);border-radius:38px;padding:11px;box-shadow:0 18px 50px rgba(25,28,23,.25);flex:0 0 auto}
#screen{height:760px;max-height:calc(100vh - 60px);min-height:620px;max-width:none;margin:0;border-radius:28px;box-shadow:none;padding-top:0}
.snack{bottom:76px}
.panel{flex:1 1 340px;max-width:460px;min-width:0;display:flex;flex-direction:column;gap:14px;font-size:16px}
.panel section{background:var(--superficie);border:1px solid var(--linea);border-radius:14px;padding:14px;box-shadow:var(--sombra)}
.panel h3{margin:0 0 8px;font-size:17px}
.panel p{font-size:16px}
.panel .btns{display:flex;flex-wrap:wrap;gap:8px}
.panel button{font:inherit;font-size:14px;font-weight:700;border-radius:8px;border:2px solid var(--verde);background:transparent;color:var(--verde);padding:6px 10px;min-height:40px;cursor:pointer}
.panel button.on{background:var(--verde);color:var(--verde-tinta)}
.mail{border-top:1px solid var(--linea);padding:8px 0;font-size:14px}
.mail b{color:var(--verde-texto)}
.rules{font-size:13px;width:100%;border-collapse:collapse}
.rules td,.rules th{border-bottom:1px solid var(--linea);padding:5px 4px;text-align:left;vertical-align:top}
.rules code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--verde-suave);padding:1px 4px;border-radius:4px}
.tablewrap{overflow-x:auto}
@media (max-width:480px){.phone{padding:6px;border-radius:26px}#screen{border-radius:20px;height:calc(100vh - 40px)}}
</style>

P.p04=()=>{const u=DB.users.find(x=>x.correo===S.ctx.email);const wait=u&&u.otp?Math.max(0,Math.ceil((u.otp.enviado+60e3-now())/1000)):0;const left=u&&u.otp?3-u.otp.reenvios:0;
 return {t:"Verifique su correo",back:0,h:`<h2>Escriba el código</h2><p>Enviamos un código de 6 dígitos a <b>${esc(S.ctx.email||"")}</b>. Vale 15 minutos.</p>${topBanner()}${fld("otp","Código de 6 dígitos",{im:"numeric",max:8,ac:"one-time-code"})}${btn("otpv","Activar cuenta")}<p class="muted" id="wait">Reenvíos disponibles: ${left}.${wait?` Puede pedir otro código en ${Math.floor(wait/60)}:${pad(wait%60)}.`:""}</p>${btn("otpr","Reenviar código","sec",wait?"data-wait=1":"")}<button class="linkbtn" data-act="go:p06">Cambiar correo</button>`}};
P.p06=()=>({t:"Cambiar correo",h:`<p>La cuenta aún no está activa. Escriba el correo correcto y le enviaremos un código nuevo. Cuenta como un reenvío.</p>${topBanner()}${fld("nmail","Correo nuevo",{type:"email"})}${fld("nmail2","Confirmar correo nuevo",{type:"email"})}${btn("chm","Enviar código nuevo")}${btn("back","Cancelar","sec")}`});
P.p07=()=>({t:"Ingresar",back:0,h:`<div style="height:8px"></div>${topBanner()}${fld("lmail","Correo",{type:"email",ac:"email"})}${fld("lpass","Clave",{type:"password",ac:"current-password"})}${btn("login","Ingresar")}<button class="linkbtn" data-act="go:p02">Crear cuenta</button><p class="muted" style="text-align:center">Cuentas de prueba: maria.perez@correo.com / Siembra#2026a</p>`});
P.p09=()=>({t:"Inicio",nav:0,h:`${topBanner()}<div class="portada"><img src="${LOGO}" alt="" width="84" height="84"><h2>Bienvenido a Sembrando Futuro</h2><p>Aún no tiene fincas. Registre la primera para empezar a calcular y a llevar sus cuentas.</p></div>${btn("go:p12","Registrar mi primera finca")}${btn("go:p16","Ver catálogo de cultivos","sec")}`});
P.p10=()=>{const farms=myFarms(),cs=myCycles();if(!cs.length&&!farms.length)return P.p09();
 if(!S.sel.farm||!farms.some(f=>f.id===S.sel.farm))S.sel.farm=farms[0]?.id;
 const fc=cs.filter(c=>c.f===S.sel.farm);if(!S.sel.cycle||!fc.some(c=>c.id===S.sel.cycle))S.sel.cycle=(fc.find(c=>c.estado==="ACTIVO")||fc[0])?.id;
 const c=cyc(S.sel.cycle);let body;
 if(!c)body=`<div class="alert alert-secondary">Esta finca aún no tiene ciclos. Cree el primero desde Fincas.</div>${btn("go:p14","Nuevo ciclo")}`;
 else{const m=fin(c.id),sm=semaforo(c);const sv=sm?kv("Vigencia ("+c.vig+(c.vig===1?" año":" años")+")",`<span class="badge ${sm.k==="VERDE"?"":"off"}">${sm.k}</span> <span class="muted">${fmt(sm.pct,0)} % restante</span>`):"";const mats=c.cs.map(x=>{const m2=mataC(c,x);return m2===null?"":kv("Matas de "+cult(x.cult).nombre.toLowerCase(),fmt(m2))}).join("");const prs=c.cs.map(x=>{const m2=mataC(c,x);return m2===null?"":proyHtml(cult(x.cult),m2,c.fecha,"Proyección de cosecha · "+cult(x.cult).nombre)}).join("");const ests=c.cs.map(x=>{const e=estim(c,x);return e?`<div class="card"><h3>Costos de referencia · ${esc(cult(x.cult).nombre)}</h3>${kv("Siembra inicial",money(e.siembra))}${kv("Insumos de un año",money(e.insumos))}${kv("Jornales al año",fmt(e.jornales))}<p class="muted mt-2 mb-0">Son valores orientativos de la ficha técnica, no un presupuesto.</p></div>`:""}).join("");
  const tot=c.cs.reduce((t,x)=>{const q=mataC(c,x);return q===null||t===null?null:t+q},0),per=m.u<0,tope=Math.max(m.g,m.i,1);
  const kp=(ic,et,v)=>`<div class="kpi"><span>${ico(ic,18)}${et}</span><b>${v}</b></div>`;
  const br=(cl,et,v)=>`<div class="barra-fila"><span>${et}</span><div class="barra-pista"><div class="barra ${cl}" style="--v:${(v/tope).toFixed(4)}"></div></div></div>`;
  const sv2=sm?kv("Vigencia",`<span class="badge sem-${sm.k.toLowerCase()}">${sm.k[0]+sm.k.slice(1).toLowerCase()}</span> ${fmt(sm.pct,0)} % restante`):"";
  body=`<h3 class="mb-2">Resumen del ciclo</h3><div class="kpis"><div class="kpi kpi-grande ${per?"perdida":"ganancia"}"><span>${ico(per?"bajada":"subida",20)}${per?"Pérdida":"Utilidad neta"}</span><b>${money(m.u)}</b><small>Rentabilidad ${fmt(m.r,1)} %</small></div>${kp("subida","Ingresos",money(m.i))}${kp("bajada","Gastos",money(m.g))}${kp("area","Área efectiva",ha2(c.efect))}${kp("brote","Total de matas",tot===null?"—":fmt(tot))}</div><div class="card"><h3>Ingresos y gastos</h3><div class="barras">${br("barra-ingreso","Ingresos",m.i)}${br("barra-gasto","Gastos",m.g)}</div>${kv("Utilidad por hectárea",money(Math.round(m.ha)))}</div><div class="card"><h3>Vigencia del ciclo</h3>${sv2}</div>${prs}${ests}${S.online?"":banner("warn",E("V-44").m,"V-44")}${pendCount()?`<div class="alert alert-secondary">Pendientes por enviar: ${pendCount()} ${pendCount()===1?"registro":"registros"}</div>`:""}${c.estado==="ACTIVO"?btn("go:p21","Registrar gasto")+btn("go:p15","Cerrar ciclo","sec"):`<div class="alert alert-secondary">Ciclo cerrado el ${dstr(c.cierre)}.</div>`}`}
 return {t:"Inicio",nav:0,h:`${topBanner()}${fld("selFarm","Finca",{opts:farms.map(f=>[f.id,f.nombre]),value:S.sel.farm,rerender:1})}${fld("selCycle","Ciclo",{opts:fc.length?fc.map(x=>[x.id,cyLabel(x).split(" · ").slice(1).join(" · ")]):[["","Sin ciclos"]],value:S.sel.cycle,rerender:1})}${body}`}};
P.p11=()=>{const farms=myFarms();let h=topBanner();
 farms.forEach(f=>{const cs=DB.cycles.filter(c=>c.f===f.id);h+=`<div class="card"><h3 class="tarjeta-finca"><span class="chip-ico chip-verde">${ico("mapa",20)}</span><span>${esc(f.nombre)} <span class="muted">· ${fmt(cs.reduce((s,c)=>s+c.bruta,0),1)} ha</span></span></h3>`;
  cs.forEach(c=>{const sm=semaforo(c);h+=`<div class="fila"><div class="grow"><b>${esc(c.nombre||"Ciclo")}</b> <span class="badge ${c.estado==="ACTIVO"?"":"off"}">${c.estado}</span><div class="muted">${esc(cname(c))} · área efectiva ${ha2(c.efect)}${sm?" · "+sm.k:""}</div></div></div><div class="fila flex-wrap gap-2"><button class="badge" data-act="area:${c.id}">Área real</button>${c.estado==="ACTIVO"?`<button class="badge" data-act="addcult:${c.id}">Agregar cultivo</button>`:""}<button class="badge" data-act="fin:${c.id}">Finanzas</button>${c.estado==="ACTIVO"?`<button class="badge" data-act="close:${c.id}">Cerrar</button>`:""}</div>`});
  h+=`<div class="fila"><button class="badge" data-act="newcy:${f.id}">Nuevo ciclo</button></div></div>`});
 return {t:"Mis fincas",nav:1,h:h+btn("go:p12","Agregar finca")}};
P.p12=()=>({t:"Nueva finca",h:`${topBanner()}${fld("fnom","Nombre de la finca",{hint:"De 2 a 60 caracteres."})}<p class="muted">Después de guardar la finca podrá crear su primer ciclo de cultivo.</p>${btn("savefarm","Guardar finca")}`});
P.p13=()=>{const l=cyc(S.ctx.cy);const u=val("unit")||"m2";return {t:"Área efectiva",h:`${topBanner()}<div class="card"><h3>Ciclo ${esc(l.nombre||"sin nombre")}</h3>${kv("Área bruta",ha2(l.bruta))}</div>${fld("unit","Unidad del área no sembrable",{opts:[["m2","m²"],["ha","hectáreas"],["plaza","plazas"]],value:u,rerender:1})}${fld("nosemb","Área no sembrable",{im:"decimal",hint:"1 ha = 10.000 m² = 1,5625 plazas (1 plaza = 0,64 ha)."})}<div class="card hl" id="prev13"></div>${btn("savearea","Guardar")}${btn("go:p11","Ahora no","sec")}`}};
P.p14=()=>{const mc=val("marco");return {t:"Nuevo ciclo",h:`${topBanner()}${fld("cfinca","Finca",{opts:[["","Elija una finca"],...myFarms().map(f=>[f.id,f.nombre])]})}${fld("clnom","Nombre del lote (opcional)",{hint:"Solo es una referencia; puede repetirse."})}${fld("carea","Área bruta (ha)",{im:"decimal",hint:"De 0,0001 a 10.000 hectáreas."})}${fld("cpend","Pendiente (%)",{im:"decimal",hint:"De 0 a 100 %."})}${fldF("cfecha","Fecha de siembra",{min_f:"2020-01-01",max_f:istr(hoyD().getTime()+366*864e5)})}${fld("cvig","Vigencia en años (opcional)",{im:"numeric",hint:"Entero de 1 a 50."})}${fld("ccult","Cultivo",{opts:cultOpts()})}<label>Marco de siembra (opcional)</label>${seg("marco",[["cuadrado","Cuadrado"],["rectangular","Rectangular"],["tresbolillo","Tresbolillo"]])}${mc?fld("ca",mc==="rectangular"?"Distancia entre surcos (m)":"Distancia entre matas (m)",{im:"decimal"}):""}${mc==="rectangular"?fld("cb","Distancia entre matas (m)",{im:"decimal"}):""}${btn("savecy","Iniciar ciclo")}`}};
P.p28=()=>{const c=cyc(S.ctx.cy);const ya=c.cs.map(x=>x.cult);const am=val("amarco");return {t:"Agregar cultivo",h:`${topBanner()}<div class="card"><h3>${esc(c.nombre||"Ciclo")}</h3>${kv("Ya tiene",esc(cname(c)))}</div>${fld("acult","Cultivo",{opts:[["","Elija un cultivo"],...CAT.map(x=>[x.codigo,x.nombre])]})}<label>Marco de siembra (opcional)</label>${seg("amarco",[["cuadrado","Cuadrado"],["rectangular","Rectangular"],["tresbolillo","Tresbolillo"]])}${am?fld("aa",am==="rectangular"?"Distancia entre surcos (m)":"Distancia entre matas (m)",{im:"decimal"}):""}${am==="rectangular"?fld("ab","Distancia entre matas (m)",{im:"decimal"}):""}${btn("savecult","Agregar cultivo")}${btn("back","Cancelar","sec")}`}};
P.p15=()=>{const c=cyc(S.ctx.cy),m=fin(c.id);if(S.ctx.done)return{t:"Ciclo cerrado",back:0,h:`<div class="alert alert-success">El ciclo se cerró el ${dstr(c.cierre)}. Ya no admite nuevos registros.</div><div class="card hl"><h3>Balance final</h3>${kv("Gastos",money(m.g))}${kv("Ingresos",money(m.i))}${kv("Utilidad neta",money(m.u))}${kv("Rentabilidad",fmt(m.r,1)+" %")}${kv("Utilidad por hectárea",money(Math.round(m.ha)))}</div>${btn("goroot:p10","Volver al inicio")}`};
 return {t:"Cerrar ciclo",h:`${topBanner()}<div class="card"><h3>${esc(cyLabel(c))}</h3>${kv("Siembra",dstr(c.fecha))}${kv("Gastos",money(m.g))}${kv("Ingresos",money(m.i))}</div>${fldF("cierre","Fecha de cierre",{min_f:istr(c.fecha),max_f:istr(hoyD().getTime())})}${S.ctx.ask?banner("warn",E("V-30").m,"V-30")+btn("closeyes","Sí, cerrar ciclo")+btn("back","Cancelar","sec"):btn("closego","Cerrar ciclo")+btn("back","Cancelar","sec")}`}};
P.p16=()=>({t:"Catálogo",back:0,nav:4,h:`<p class="muted">Tres cultivos del norte del Cauca con su ficha técnica, disponibles sin internet.</p>`+CAT.map(c=>`<div class="fila"><button class="tap" data-act="cult:${c.codigo}"><span class="grow"><b>${esc(c.nombre)}</b><span class="muted" style="display:block">Unidad: ${esc(c.unidad_comercial)}</span></span><span aria-hidden="true">›</span></button></div>`).join("")});
P.p17=()=>{const c=cult(S.ctx.cult)||CAT[0];const mn=c.distancia_min_m,mx=c.distancia_max_m;
 return {t:c.nombre,h:`<div class="card"><h3>Ficha técnica</h3>${kv("Distancia recomendada",`${fmt(mn,1)} a ${fmt(mx,1)} m`)}${kv("Marcos","Cuadrado, rectangular, tresbolillo")}${kv("Unidad comercial",esc(c.unidad_comercial))}</div>${(()=>{const f=c.ficha_tecnica;if(!f)return "";return `<div class="card"><h3>Costos de referencia (por ${fmt(f.base_plantas)} plantas)</h3>${kv("Hoyado (por planta)",money(f.costo_hoyado_cop))}${kv("Colino (por planta)",money(f.costo_colino_cop))}${kv("Insumos al año (por planta)",money(f.insumo_anual_cop))}${kv("Jornales de limpieza al año",fmt(f.jornales_limpieza_anio))}${kv("Jornales de riego al año",fmt(f.jornales_riego_anio))}</div>${f.datos_extra&&f.datos_extra.estado!=="CONFIRMADO"?`<p class="muted">Valores por validar con una fuente técnica.</p>`:""}`})()}${cosechaFicha(c)}<p class="muted">Fuente: ${esc(c.fuente_tecnica)}.</p>${btn("tocalc:"+c.codigo,"Calcular matas")}`}};
const markPick=()=>{const m=val("cmarco");return m};
P.p18=()=>{const m=val("cmarco");return {t:"Calcular matas",nav:2,back:0,h:`${topBanner()}${fld("clot","Ciclo",{opts:[["","Sin ciclo (solo por hectárea)"],...myCycles().filter(c=>c.estado==="ACTIVO").map(c=>[c.id,farm(c.f).nombre+" · "+(c.nombre||"Ciclo")+" ("+ha2(c.efect)+")"])]})}${fld("ccu","Cultivo",{opts:cultOpts()})}<label>Marco de siembra</label>${seg("cmarco",[["cuadrado","Cuadrado"],["rectangular","Rectangular"],["tresbolillo","Tresbolillo"]])}${err1("cmarco")}${m?fld("cda",m==="rectangular"?"Distancia entre surcos (m)":"Distancia entre matas (m)",{im:"decimal"}):""}${m==="rectangular"?fld("cdb","Distancia entre matas (m)",{im:"decimal"}):""}${btn("calc","Calcular")}`}};
P.p19=()=>{const r=S.ctx.res;const warn=r.warn?`<div class="alert alert-warning" role="alert">${esc(r.warn)}${codeTag("V-34")}<br>${esc(r.effect)}</div>`:"";
 return {t:"Resultado",nav:2,h:`<div class="card hl"><h3>${esc(r.titulo)}</h3>${kv("Matas por hectárea",fmt(r.ha,2))}${r.ef!=null?kv("Área efectiva",ha2(r.ef))+kv("Matas en el ciclo",fmt(r.lote)):""}</div>${warn}${r.cu?proyHtml(r.cu,r.ef!=null?r.lote:r.ha,r.sie,r.ef!=null?"Proyección de cosecha del ciclo":"Proyección de cosecha por hectárea"):""}${btn("usecy","Usar en un ciclo")}${btn("go:p18","Calcular otra vez","sec")}`}};
const limReg=()=>{const c=cyc(S.sel.cycle);return {min_f:c?istr(c.fecha):undefined,max_f:istr(hoyD().getTime())}};
const moves=cid=>[...DB.exp.filter(x=>x.c===cid).map(x=>({k:"exp",r:x,t:x.obs||x.cat,s:"Gasto · "+x.cat,v:-x.valor})),...DB.jor.filter(x=>x.c===cid).map(x=>({k:"jor",r:x,t:`Jornales (${fmt(x.n,1).replace(",0","")} × ${money(x.valor)})`,s:"Mano de obra",v:-x.n*x.valor})),...DB.inc.filter(x=>x.c===cid).map(x=>({k:"inc",r:x,t:"Venta de "+cult(x.cult||cyc(cid).cs[0].cult).nombre.toLowerCase(),s:`${fmt(x.q,1).replace(",0","")} × ${money(x.precio)}`,v:x.q*x.precio}))].sort((a,b)=>b.r.fecha-a.r.fecha);
const ICM={exp:"recibo",jor:"personas",inc:"subida"},CHIP={exp:"gasto",jor:"jornal",inc:"ingreso"};
P.p20=()=>{const cs=myCycles();if(!cs.length)return{t:"Finanzas",nav:3,back:0,h:`<div class="alert alert-secondary">Cree un ciclo para registrar gastos e ingresos.</div>${btn("go:p14","Nuevo ciclo")}`};
 if(!S.sel.cycle||!cs.some(c=>c.id===S.sel.cycle))S.sel.cycle=cs[0].id;const c=cyc(S.sel.cycle),m=fin(c.id);
 return {t:"Finanzas",nav:3,back:0,h:`${topBanner()}${fld("selCycle","Ciclo",{opts:cs.map(x=>[x.id,cyLabel(x)]),value:S.sel.cycle,rerender:1})}${c.estado==="CERRADO"?`<div class="alert alert-secondary">Ciclo cerrado: no admite nuevos registros.</div>`:""}<div class="card hl"><h3>${esc(cname(c))}</h3>${kv("Gastos",money(m.g))}${kv("Ingresos",money(m.i))}${m.u<0?`<div class="kv perdida"><span>Pérdida</span><b>${money(m.u)}</b></div>`:kv("Utilidad neta",money(m.u))}${kv("Rentabilidad",fmt(m.r,1)+" %")}</div>${moves(c.id)?`<p class="muted mb-2">Seleccione un registro para editarlo o eliminarlo.</p>`:""}${moves(c.id).map(x=>`<div class="fila"><button class="tap" data-act="edit:${x.k}:${x.r.id}"><span class="chip-ico chip-${CHIP[x.k]||x.k}">${ico(ICM[x.k]||"recibo",20)}</span><span class="grow"><b>${esc(x.t)}</b><span class="muted d-block">${esc(x.s)} · ${dstr(x.r.fecha)}</span></span><b class="monto ${x.v<0?"sale":"entra"}">${x.v<0?"− ":""}${money(Math.abs(x.v))}</b></button>${x.r.sync==="PENDIENTE"?'<span class="badge off">pend.</span>':""}</div>`).join("")}<div class="mt-3"></div>${btn("go:p21","Registrar gasto")}${btn("go:p22","Registrar jornales","sec")}${btn("go:p23","Registrar ingreso","sec")}`}};
const cyHead=()=>{const c=cyc(S.sel.cycle);return c?`<div class="alert alert-secondary">${esc(cyLabel(c))}</div>`:""};
P.p21=()=>({t:"Registrar gasto",h:`${topBanner()}${cyHead()}${fldF("gfecha","Fecha",limReg())}${fld("gcat","Categoría",{opts:[["","Elija una categoría"],...CATS.map(c=>[c,c[0].toUpperCase()+c.slice(1)])]})}${fld("gval","Valor ($)",{im:"numeric",hint:"De $1 a $50.000.000, solo números."})}${fld("gobs","Observaciones (opcional)",{hint:"Máximo 150 caracteres."})}${btn("savegas","Guardar gasto")}`});
P.p22=()=>({t:"Registrar jornales",h:`${topBanner()}${cyHead()}${fldF("jfecha","Fecha",limReg())}${fld("jn","Número de jornales",{im:"decimal",hint:"De 0,5 a 999, de medio en medio."})}${fld("jv","Valor del jornal ($)",{im:"numeric"})}<div class="card hl" id="prevj"></div>${btn("savejor","Guardar jornales")}`});
P.p23=()=>{const c=cyc(S.sel.cycle);const sc=c?(val("icult")||c.cs[0].cult):null;const u=c?cult(sc).unidad_comercial:"unidad";return {t:"Registrar ingreso",h:`${topBanner()}${cyHead()}${fldF("ifecha","Fecha",limReg())}${c&&c.cs.length>1?fld("icult","Cultivo vendido",{opts:c.cs.map(x=>[x.cult,cult(x.cult).nombre]),value:sc,rerender:1}):""}<div class="card"><h3>Unidad comercial</h3>${esc(u)}</div>${fld("iq","Cantidad",{im:"decimal",hint:"De 0,1 a 10.000."})}${fld("ip","Precio por unidad ($)",{im:"numeric"})}<div class="card hl" id="previ"></div>${btn("saveinc","Guardar ingreso")}`}};
P.p24=()=>{const {k,id}=S.ctx.rec;const r=(k==="exp"?DB.exp:k==="jor"?DB.jor:DB.inc).find(x=>x.id===id);if(!r)return P.p20();
 const f=k==="exp"?`${fldF("gfecha","Fecha",limReg())}${fld("gcat","Categoría",{opts:CATS.map(c=>[c,c[0].toUpperCase()+c.slice(1)])})}${fld("gval","Valor ($)",{im:"numeric"})}${fld("gobs","Observaciones (opcional)")}`:k==="jor"?`${fldF("jfecha","Fecha",limReg())}${fld("jn","Número de jornales",{im:"decimal"})}${fld("jv","Valor del jornal ($)",{im:"numeric"})}`:`${fldF("ifecha","Fecha",limReg())}${fld("iq","Cantidad",{im:"decimal"})}${fld("ip","Precio por unidad ($)",{im:"numeric"})}`;

 $("#content").scrollTop=top;liveText();panel()}

 const ids=RR[S.screen]||[];
 const rules=ids.length?`<div class="tablewrap"><table class="rules"><tr><th>Regla</th><th>Campo</th><th>Escriba (válido)</th><th>Escriba (inválido)</th></tr>${ids.map(i=>{const v=VROW[i];return `<tr><td><code>${i}</code></td><td>${esc(v[3])}</td><td>${esc(v[5]||"–")}</td><td>${esc(v[6]||"–")}</td></tr>`}).join("")}</table></div>`:'<p class="muted">Esta pantalla no tiene reglas de entrada. Muestra datos calculados.</p>';
 const T=new Date(now());
 const html=`<section><h3>Prueba de la pantalla actual</h3><p><b>${esc(NAMES[S.screen]||S.screen)}</b> · requisito ${RFS[S.screen]||"—"}</p>${rules}</section>

 const sig=html;if(sig!==lastPanel){lastPanel=sig;$("#panel").innerHTML=html}

function jump(s){
 if(AUTH.has(s)&&!S.user){const u=DB.users.find(x=>x.id==="U-01");loginOK(u)}
 const pre={};
 if(s==="p04"||s==="p06"){if(!S.ctx.email||!accOf())S.ctx.email="pedro.gomez@correo.com"}
 if(s==="p13")S.ctx.cy=S.ctx.cy||"C-01";
 if(s==="p28")S.ctx.cy="C-01";
 if(s==="p15"){S.ctx={...S.ctx,cy:S.sel.cycle&&cyc(S.sel.cycle).estado==="ACTIVO"?S.sel.cycle:"C-01",done:false,ask:false}}
 if(s==="p17")S.ctx.cult=S.ctx.cult||"CAFE";
 if(s==="p19"){const c=cult("CAFE");S.ctx.res={ha:nHa("cuadrado",2.5),ef:0.9,lote:lotes("cuadrado",2.5,0,0.9),cu:cult("CAFE"),sie:null,titulo:"Café · cuadrado 2,5 m",warn:E("V-34",{r:"(1,0–2,0 m)"}).m,effect:c.advertencia_mayor,input:{clote:"C-01",ccult:"CAFE",marco:"cuadrado",ca:"2,5",cb:""}}}
 if(s==="p24"){const r=DB.exp[0]||DB.jor[0]||DB.inc[0];const k=DB.exp[0]?"exp":DB.jor[0]?"jor":"inc";if(!r)return;S.sel.cycle=r.c;A.edit(k,r.id);return}
 if(s==="p20"&&!S.sel.cycle)S.sel.cycle="C-01";
 if(["p21","p22","p23"].includes(s)&&!S.sel.cycle)S.sel.cycle="C-01";
 S.stack=[];S.screen=s;enter(s,pre);render()}
const SUB=new Set(["reg","otpv","otpr","chm","login","savefarm","savecult","savearea","savecy","closego","closeyes","calc","savegas","savejor","saveinc","saveedit","del","syncnow"]);
document.addEventListener("click",ev=>{
 const p=ev.target.closest("[data-p]");
 if(p){const k=p.dataset.p;if(k==="on"||k==="off"){S.online=k==="on";if(S.online)trySync();render()}
  else if(k==="failnext"){DB.nextFail=!DB.nextFail;render()}else if(k==="expire"){DB.expireSession=!DB.expireSession;render()}
  else if(k.startsWith("t:")){const v=+k.slice(2);skew=v===0?0:skew+v;render()}
  else if(k.startsWith("j:"))jump(k.slice(2));else if(k==="codes"){S.codes=!S.codes;render()}
  else if(k==="reset"){skew=0;seed();render()}return}
 const a=ev.target.closest("[data-act]");if(!a)return;ev.preventDefault();
 if(a.disabled&&!a.dataset.wait)return;
 const [name,...args]=a.dataset.act.split(":");
 if(name==="go"){if(args[0]==="p15")S.ctx={...S.ctx,cy:S.sel.cycle,done:false,ask:false};return go(args[0])}
 if(A[name])A[name](SUB.has(name)||name==="seg"?a:args[0],args[1]);
});
const onIn=ev=>{const el=ev.target;if(!el.dataset||!el.dataset.f)return;S.f[el.dataset.f]=el.type==="checkbox"?el.checked:el.value;
 if(el.dataset.f==="selFarm"){S.sel.farm=el.value;S.sel.cycle=null;return render()}
 if(el.dataset.f==="selCycle"){S.sel.cycle=el.value;return render()}
 if(el.hasAttribute("data-rr"))return render();liveText()};
document.addEventListener("input",onIn);document.addEventListener("change",ev=>{if(ev.target.tagName==="SELECT"||ev.target.type==="checkbox")onIn(ev)});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.tagName==="INPUT"&&ev.target.type!=="checkbox"){const b=document.querySelector(".content .btn-primario:not([disabled])");if(b){ev.preventDefault();b.click()}}});

 const t=S.toast;if(t&&!t.dead&&(Date.now()>t.realUntil||now()>t.until)){t.m=E("V-43").m;t.dead=true;render()}else if(t&&t.dead&&Date.now()>t.realUntil+3500){S.toast=null;render()}},1000);
seed();render();
