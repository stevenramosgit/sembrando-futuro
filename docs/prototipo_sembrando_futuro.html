.rules{font-size:13px;width:100%;border-collapse:collapse}

.tablewrap{overflow-x:auto}

P.p10=()=>{const farms=myFarms(),cs=myCycles();if(!cs.length&&!farms.length)return P.p09();
 if(!S.sel.farm||!farms.some(f=>f.id===S.sel.farm))S.sel.farm=farms[0]?.id;
 const fc=cs.filter(c=>c.f===S.sel.farm);if(!S.sel.cycle||!fc.some(c=>c.id===S.sel.cycle))S.sel.cycle=(fc.find(c=>c.estado==="ACTIVO")||fc[0])?.id;
 const c=cyc(S.sel.cycle);let body;
 if(!c)body=`<div class="banner">Esta finca aún no tiene ciclos. Cree el primero desde Fincas.</div>${btn("go:p14","Nuevo ciclo")}`;
 else{const m=fin(c.id),sm=semaforo(c);const sv=sm?kv("Vigencia ("+c.vig+(c.vig===1?" año":" años")+")",`<span class="badge ${sm.k==="VERDE"?"":"off"}">${sm.k}</span> <span class="muted">${fmt(sm.pct,0)} % restante</span>`):"";const mats=c.cs.map(x=>{const m2=mataC(c,x);return m2===null?"":kv("Matas de "+cult(x.cult).nombre.toLowerCase(),fmt(m2))}).join("");const ests=c.cs.map(x=>{const e=estim(c,x);return e?`<div class="card"><h3>Costos de referencia · ${esc(cult(x.cult).nombre)}</h3>${kv("Siembra inicial",money(e.siembra))}${kv("Insumos de un año",money(e.insumos))}${kv("Jornales al año",fmt(e.jornales))}<p class="muted" style="margin:6px 0 0">Valores orientativos de la ficha técnica.</p></div>`:""}).join("");
  body=`<div class="card"><h3>Resumen del ciclo</h3>${kv("Cultivos",esc(cname(c)))}${kv("Área efectiva",fmt(c.efect,4)+" ha")}${mats}${kv("Gastos",money(m.g))}${kv("Ingresos",money(m.i))}${sv}</div><div class="card hl"><h3>Resultado</h3>${kv("Utilidad neta",money(m.u))}${kv("Rentabilidad",fmt(m.r,1)+" %")}${kv("Utilidad por hectárea",money(Math.round(m.ha)))}</div>${ests}${S.online?"":banner("warn",E("V-44").m,"V-44")}${pendCount()?`<div class="banner">Pendientes por enviar: ${pendCount()} ${pendCount()===1?"registro":"registros"}</div>`:""}${c.estado==="ACTIVO"?btn("go:p21","Registrar gasto")+btn("go:p15","Cerrar ciclo","sec"):`<div class="banner">Ciclo cerrado el ${dstr(c.cierre)}.</div>`}`}
 return {t:"Inicio",nav:0,h:`${topBanner()}${fld("selFarm","Finca",{opts:farms.map(f=>[f.id,f.nombre]),value:S.sel.farm,rerender:1})}${fld("selCycle","Ciclo",{opts:fc.length?fc.map(x=>[x.id,cyLabel(x).split(" · ").slice(1).join(" · ")]):[["","Sin ciclos"]],value:S.sel.cycle,rerender:1})}${body}`}};

 farms.forEach(f=>{const cs=DB.cycles.filter(c=>c.f===f.id);h+=`<div class="card"><h3>${esc(f.nombre)} <span class="muted">· ${fmt(cs.reduce((s,c)=>s+c.bruta,0),1)} ha</span></h3>`;
  cs.forEach(c=>{const sm=semaforo(c);h+=`<div class="row"><div class="grow"><b>${esc(c.nombre||"Ciclo")}</b> <span class="badge ${c.estado==="ACTIVO"?"":"off"}">${c.estado}</span><div class="muted">${esc(cname(c))} · área efectiva ${fmt(c.efect,4)} ha${sm?" · "+sm.k:""}</div></div></div><div class="row" style="padding-left:14px"><button class="badge" data-act="area:${c.id}">Área real</button>${c.estado==="ACTIVO"?`<button class="badge" data-act="addcult:${c.id}">Agregar cultivo</button>`:""}<button class="badge" data-act="fin:${c.id}">Finanzas</button>${c.estado==="ACTIVO"?`<button class="badge" data-act="close:${c.id}">Cerrar</button>`:""}</div>`});

 return {t:"Mis fincas",nav:1,h:h+btn("go:p12","Agregar finca")}};

 if(!S.sel.cycle||!cs.some(c=>c.id===S.sel.cycle))S.sel.cycle=cs[0].id;const c=cyc(S.sel.cycle),m=fin(c.id);

P.p27=()=>({t:"Política de datos",h:`<div class="legal"><b>Responsables.</b> Mikael Steven Ramos Musse y Kevin Zambrano, estudiantes de Ingeniería de Sistemas de Unicomfacauca.

<b>Datos que se recolectan.</b> Nombre, correo, ubicación, clave (solo como hash con sal) y los datos que usted registra: fincas, ciclos con sus cultivos, gastos, jornales e ingresos.

<b>Para qué se usan.</b> Crear y proteger su cuenta, enviar el código de verificación, calcular matas por hectárea y utilidad, y sincronizar sus datos. No se usan para publicidad ni se comparten con terceros.

const GROUPS=[["Acceso",["p01","p02","p04","p06","p07","p27"]],["Panel",["p09","p10"]],["Fincas y ciclos",["p11","p12","p13","p14","p28","p15"]],["Catálogo y cálculo",["p16","p17","p18","p19"]],["Finanzas",["p20","p21","p22","p23","p24"]],["Conexión y cuenta",["p25","p26"]]];
const RR={p02:["V-01","V-02","V-03","V-04","V-05","V-06","V-07","V-08"],p04:["V-09","V-10","V-11","V-12","V-13","V-14","V-15"],p06:["V-03","V-04","V-05","V-06","V-13","V-14"],p07:["V-16","V-17","V-18","V-19"],p12:["V-22"],p13:["V-26"],p14:["V-22","V-24","V-25","V-27","V-28","V-48","V-49","V-33"],p28:["V-27","V-33","V-50","V-31"],p15:["V-28","V-29","V-30"],p18:["V-32","V-33","V-34"],p19:["V-34"],p21:["V-31","V-28","V-47","V-35","V-36","V-37","V-38"],p22:["V-31","V-28","V-47","V-39","V-40"],p23:["V-31","V-28","V-47","V-41","V-42"],p24:["V-43","V-31","V-28","V-47"],p25:["V-44","V-45","V-46"],p26:["V-20"],p20:["V-31"],p10:["V-44"]};
const RFS={p01:"RF-02, RF-03",p02:"RF-02",p04:"RF-02",p06:"RF-02",p07:"RF-03",p09:"RF-07",p10:"RF-07, RF-28, RF-35",p11:"RF-12",p12:"RF-12",p13:"RF-13",p14:"RF-14",p28:"RF-14",p15:"RF-15",p16:"RF-17, RF-37",p17:"RF-17",p18:"RF-18",p19:"RF-18",p20:"RF-23, RF-24, RF-25, RF-27, RF-28",p21:"RF-23",p22:"RF-24",p23:"RF-25",p24:"RF-27",p25:"RF-35, RF-36",p26:"RF-04",p27:"RF-02"};
let lastPanel="";
function panel(){
 const mails=DB.mails.slice(0,6).map(m=>`<div class="mail">Para <b>${esc(m.a)}</b> · ${hhmm(m.t)}<br>Asunto: Su código de Sembrando Futuro<br>Su código de verificación es <b>${m.code}</b>. Vale 15 minutos.</div>`).join("")||'<p class="muted">Aún no se ha enviado ningún correo.</p>';
 const ids=RR[S.screen]||[];
 const rules=ids.length?`<div class="tablewrap"><table class="rules"><tr><th>Regla</th><th>Campo</th><th>Escriba (válido)</th><th>Escriba (inválido)</th></tr>${ids.map(i=>{const v=VROW[i];return `<tr><td><code>${i}</code></td><td>${esc(v[3])}</td><td>${esc(v[5]||"–")}</td><td>${esc(v[6]||"–")}</td></tr>`}).join("")}</table></div>`:'<p class="muted">Esta pantalla no tiene reglas de entrada. Muestra datos calculados.</p>';
 const T=new Date(now());
 const html=`<section><h3>Prueba de la pantalla actual</h3><p><b>${esc(NAMES[S.screen]||S.screen)}</b> · requisito ${RFS[S.screen]||"—"}</p>${rules}</section>
<section><h3>Conexión (RF-35, RF-36)</h3><div class="btns"><button data-p="on" class="${S.online?"on":""}">En línea</button><button data-p="off" class="${S.online?"":"on"}">Sin conexión</button></div><p class="muted" style="margin-top:8px">Sin conexión, los registros quedan pendientes y se envían solos al volver.</p><div class="btns"><button data-p="failnext" class="${DB.nextFail?"on":""}">Simular falla del servidor</button><button data-p="expire" class="${DB.expireSession?"on":""}">Simular sesión vencida</button></div></section>
<section><h3>Reloj simulado</h3><p>Hora de la app: <b>${pad(T.getHours())}:${pad(T.getMinutes())}:${pad(T.getSeconds())}</b> ${skew?`(+${Math.round(skew/1000)} s)`:""}</p><div class="btns"><button data-p="t:10000">+10 s</button><button data-p="t:60000">+60 s</button><button data-p="t:900000">+15 min</button><button data-p="t:86400000">+24 h</button><button data-p="t:0">Volver a la hora real</button></div><p class="muted" style="margin-top:8px">Sirve para probar el reenvío (60 s), el código vencido (15 min), el bloqueo de ingreso (15 min), el deshacer (10 s) y el borrado de cuentas pendientes (24 h).</p></section>
<section><h3>Correo simulado</h3>${mails}</section>
<section><h3>Ir a una pantalla</h3>${GROUPS.map(g=>`<p style="margin:0 0 4px"><b>${g[0]}</b></p><div class="btns" style="margin-bottom:10px">${g[1].map(i=>`<button data-p="j:${i}" class="${S.screen===i?"on":""}">${NAMES[i]}</button>`).join("")}</div>`).join("")}<p class="muted">P-03, P-05 y P-08 son los estados con errores de P-02, P-04 y P-07: escriba datos inválidos y presione el botón. Al saltar a una pantalla interna se entra como María Pérez.</p></section>
<section><h3>Opciones</h3><div class="btns"><button data-p="codes" class="${S.codes?"on":""}">Mostrar códigos de regla (V-xx)</button><button data-p="reset">Restablecer datos de prueba</button></div></section>`;
 const sig=html;if(sig!==lastPanel){lastPanel=sig;$("#panel").innerHTML=html}
}
function jump(s){
 if(AUTH.has(s)&&!S.user){const u=DB.users.find(x=>x.id==="U-01");loginOK(u)}
 const pre={};
 if(s==="p04"||s==="p06"){if(!S.ctx.email||!accOf())S.ctx.email="pedro.gomez@correo.com"}
 if(s==="p13")S.ctx.cy=S.ctx.cy||"C-01";
 if(s==="p28")S.ctx.cy="C-01";
 if(s==="p15"){S.ctx={...S.ctx,cy:S.sel.cycle&&cyc(S.sel.cycle).estado==="ACTIVO"?S.sel.cycle:"C-01",done:false,ask:false}}
 if(s==="p17")S.ctx.cult=S.ctx.cult||"CAFE";
 if(s==="p19"){const c=cult("CAFE");S.ctx.res={ha:nHa("cuadrado",2.5),ef:0.9,lote:rhu(nHa("cuadrado",2.5)*0.9),titulo:"Café · cuadrado 2,5 m",warn:E("V-34",{r:"(1,0–2,0 m)"}).m,effect:c.advertencia_mayor,input:{clote:"C-01",ccult:"CAFE",marco:"cuadrado",ca:"2,5",cb:""}}}
 if(s==="p24"){const r=DB.exp[0]||DB.jor[0]||DB.inc[0];const k=DB.exp[0]?"exp":DB.jor[0]?"jor":"inc";if(!r)return;S.sel.cycle=r.c;A.edit(k,r.id);return}
 if(s==="p20"&&!S.sel.cycle)S.sel.cycle="C-01";
 if(["p21","p22","p23"].includes(s)&&!S.sel.cycle)S.sel.cycle="C-01";
 S.stack=[];S.screen=s;enter(s,pre);render()}
const SUB=new Set(["reg","otpv","otpr","chm","login","savefarm","savecult","savearea","savecy","closego","closeyes","calc","savegas","savejor","saveinc","saveedit","del","syncnow"]);
document.addEventListener("click",ev=>{
 const p=ev.target.closest("[data-p]");
 if(p){const k=p.dataset.p;if(k==="on"||k==="off"){S.online=k==="on";if(S.online)trySync();render()}
  else if(k==="failnext"){DB.nextFail=!DB.nextFail;render()}else if(k==="expire"){DB.expireSession=!DB.expireSession;render()}
  else if(k.startsWith("t:")){const v=+k.slice(2);skew=v===0?0:skew+v;render()}
  else if(k.startsWith("j:"))jump(k.slice(2));else if(k==="codes"){S.codes=!S.codes;render()}
  else if(k==="reset"){skew=0;seed();render()}return}
 const a=ev.target.closest("[data-act]");if(!a)return;ev.preventDefault();
 if(a.disabled&&!a.dataset.wait)return;
 const [name,...args]=a.dataset.act.split(":");
 if(name==="go"){if(args[0]==="p15")S.ctx={...S.ctx,cy:S.sel.cycle,done:false,ask:false};return go(args[0])}
 if(A[name])A[name](SUB.has(name)||name==="seg"?a:args[0],args[1]);
});
const onIn=ev=>{const el=ev.target;if(!el.dataset||!el.dataset.f)return;S.f[el.dataset.f]=el.type==="checkbox"?el.checked:el.value;
 if(el.dataset.f==="selFarm"){S.sel.farm=el.value;S.sel.cycle=null;return render()}
 if(el.dataset.f==="selCycle"){S.sel.cycle=el.value;return render()}
 if(el.hasAttribute("data-rr"))return render();liveText()};
document.addEventListener("input",onIn);document.addEventListener("change",ev=>{if(ev.target.tagName==="SELECT"||ev.target.type==="checkbox")onIn(ev)});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.tagName==="INPUT"&&ev.target.type!=="checkbox"){const b=document.querySelector(".content .btn:not(.sec):not(.danger):not([disabled])");if(b){ev.preventDefault();b.click()}}});
setInterval(()=>{const u=S.screen==="p04"?accOf():null;if(u){const w=Math.max(0,Math.ceil((u.otp.enviado+60e3-now())/1000));const el=$("#wait");const left=3-u.otp.reenvios;if(el){const nt=`Reenvíos disponibles: ${left}.${w?` Puede pedir otro código en ${Math.floor(w/60)}:${pad(w%60)}.`:""}`;if(el.textContent!==nt)el.textContent=nt}}
 const t=S.toast;if(t&&!t.dead&&(Date.now()>t.realUntil||now()>t.until)){t.m=E("V-43").m;t.dead=true;render()}else if(t&&t.dead&&Date.now()>t.realUntil+3500){S.toast=null;render()}},1000);
seed();render();
})();

</script>
