# Despliegue en Render (plan gratuito). Sin Docker: Render instala las dependencias, migra la base de Aiven,
# carga el catálogo inicial (sin sobrescribir lo que el administrador haya cambiado) y arranca Uvicorn.
# FastAPI sirve también la PWA (carpeta ../frontend), así la aplicación y la API salen del mismo dominio.
services:
  - type: web
    name: sembrando-futuro
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head && python -m app.cli cargar_semilla
    # --no-proxy-headers: la IP real la decide la aplicación (PROXY_CONFIABLE y PROXY_SALTOS), no Uvicorn.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /api/v1/salud
    envVars:
      - { key: PYTHON_VERSION, value: 3.14.7 }          # la misma versión de .python-version y del CI
      - { key: ENTORNO, value: produccion }             # sin tilde; con otro valor la aplicación no arranca
      - { key: CLAVE_SECRETA, generateValue: true }     # Render genera un texto aleatorio largo
      - { key: DB_HOST, sync: false }                   # datos de la base MySQL 8 de Aiven (se escriben en el panel)
      - { key: DB_PORT, sync: false }
      - { key: DB_NAME, sync: false }
      - { key: DB_USER, sync: false }
      - { key: DB_PASSWORD, sync: false }
      - { key: DB_SSL_CA, value: ca.pem }               # certificado de Aiven guardado en backend/ca.pem (es público)
      - { key: PROXY_CONFIABLE, value: si }             # la IP real llega en X-Forwarded-For
      - { key: PROXY_SALTOS, value: "3" }               # posición desde la derecha; se comprueba con scripts/verificar_limite_ip.py
      - { key: BREVO_API_KEY, sync: false }
      - { key: CORREO_REMITENTE, sync: false }          # remitente verificado en Brevo (ideal: dominio propio autenticado)
      - { key: DOMINIO, sync: false }                   # uno o varios, separados por coma: midominio.co,sembrando-futuro.onrender.com
