name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14.7" }   # la misma de Render (render.yaml) y de .python-version
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip freeze > requirements.lock       # versiones exactas con las que pasaron las pruebas (para fijarlas en requirements.txt)
      - run: flake8 app tests alembic          # estilo y complejidad ciclomática máxima de 10 (.flake8)
      - run: pytest -q --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        with: { name: cobertura-backend, path: backend/coverage.xml }
      - uses: actions/upload-artifact@v4
        with: { name: versiones-backend, path: backend/requirements.lock }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install
      - run: npm run lint                      # complejidad ciclomática máxima de 10 (eslint.config.js)
      - run: npm run test:cov
  sonar:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: cobertura-backend, path: backend }
      - if: env.SONAR_TOKEN != ''             # solo corre cuando el repositorio tiene el secreto SONAR_TOKEN
        uses: SonarSource/sonarqube-scan-action@v5
        env: { SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}" }
